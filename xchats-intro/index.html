const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, u) => a + (b - a) * u;
const out3 = u => 1 - Math.pow(1 - u, 3);
const in3 = u => u * u * u;
const io3 = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const out5 = u => 1 - Math.pow(1 - u, 5);
const hex = v => { v = Math.round(clamp(v, 0, 255)); return 'rgb(' + v + ',' + v + ',' + v + ')'; };

function pchip(P) {
  const n = P.length, h = [], d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) { h[i] = P[i + 1][0] - P[i][0]; d[i] = (P[i + 1][1] - P[i][1]) / h[i]; }
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const k = 3 / Math.sqrt(s); m[i] = k * a * d[i]; m[i + 1] = k * b * d[i]; }
  }
  return x => {
    if (x <= P[0][0]) return P[0][1];
    if (x >= P[n - 1][0]) return P[n - 1][1];
    let i = 0; while (x > P[i + 1][0]) i++;
    const t = (x - P[i][0]) / h[i], t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * P[i][1] + (t3 - 2 * t2 + t) * h[i] * m[i] +
           (-2 * t3 + 3 * t2) * P[i + 1][1] + (t3 - t2) * h[i] * m[i + 1];
  };
}
function el(parent, cls, css, html) {
  const e = document.createElement('div');
  if (cls) e.className = cls;
  if (css) e.style.cssText = css;
  if (html != null) e.innerHTML = html;
  parent.appendChild(e); return e;
}
function T(parent, txt, x, y, size, weight, color, align, extra) {
  const e = el(parent, 't', `left:${x}px;top:${y}px;font-size:${size}px;font-weight:${weight};color:${color || '#0f1419'};` +
    (align === 'c' ? 'transform:translate(-50%,-50%);' : align === 'r' ? 'transform:translate(-100%,-50%);' : '') + (extra || ''), txt);
  return e;
}

meas.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;left:-9999px;top:0;';
document.body.appendChild(meas);
function fitSize(text, weight, ls, target) {
  meas.style.font = `${weight} 100px Inter, "Helvetica Neue", Arial, sans-serif`;
  meas.style.letterSpacing = ls;
  meas.textContent = text;
  return 100 * target / meas.getBoundingClientRect().width;
}

  const d = prog(t, 3.8, 4.8);

    (t < 1.13 ? 360 : Y1(t)) + 4 * d,

  ];

function renderPills(t, ys) {
  PILL.forEach(p => {

    let show = t >= p.t0;
    if (t < p.t1) n = Math.round(p.txt.length * prog(t, p.t0, p.t1));
    if (t >= p.e0) n = Math.round(p.txt.length * (1 - prog(t, p.e0, p.e1)));

    p.el.style.display = 'flex';
    p.tx.textContent = p.txt.slice(0, n);
    p.tx.style.display = n ? 'block' : 'none';
    p.el.style.width = n ? '' : (p.line === 0 ? lerp(120, 58, prog(t, 4.25, 4.45)) : 58) + 'px';
    p.el.firstElementChild.style.display = (n === 0 && p.line === 0 && t > 4.25) ? 'none' : 'block';
    let u = prog(t, p.t0, p.t1);
    let left = lerp(p.sl, p.fl, io3(u));
    if (p.line === 0 && t >= p.e0) left = lerp(197, 410, io3(prog(t, 3.6, 4.5)));
    p.el.style.left = left + 'px';
    p.el.style.top = ys[p.line] + 'px';
    // hide the leftover circle of pill 1 once the phone has settled
    let vis = 1;
    if (p.line === 0) vis = 1 - prog(t, 4.88, 4.98);
    if (p.line !== 0 && t > 4.4) vis = 0;
    p.el.style.opacity = vis;
    if (!vis) p.el.style.display = 'none';
  });
}

    <circle id="dot" cx="540" cy="540" r="330" fill="none" stroke="#000" stroke-width="4" stroke-dasharray="5 10" vector-effect="non-scaling-stroke"/>
    <ellipse id="ell" cx="540" cy="540" rx="215" ry="410" fill="none" stroke="#000" stroke-width="4" vector-effect="non-scaling-stroke"/>
  </g>
</svg>`;
const $ = id => document.getElementById(id);
const newpill = $('newpill');
newpill.innerHTML = '<span class="lab"></span><span class="ph"></span><span class="ty"></span>';
const lab = newpill.querySelector('.lab'), ph = newpill.querySelector('.ph'), ty = newpill.querySelector('.ty');
const revR = pchip([[6.65, 0], [6.73, 60], [6.8, 170], [6.87, 320], [6.93, 480], [7.0, 700], [7.05, 900]]);
const ringS = pchip([[8.45, 1], [8.53, 1.03], [8.6, 1.07], [8.67, 1.13], [8.73, 1.2], [8.8, 1.4], [8.87, 1.7], [8.93, 2.1], [9.0, 2.8], [9.07, 4]]);
// ring geometry measured from the reference frames
const K = {
  R: pchip([[6.9, 230], [7.0, 250], [7.2, 277], [7.47, 326], [8.0, 371], [8.27, 410], [8.45, 430], [10, 430]]),
  sq: pchip([[7.0, 262], [7.2, 247], [7.47, 194], [8.0, 122], [8.27, 70], [8.45, 30], [8.6, -20], [10, -20]]),
  rx: pchip([[6.9, 130], [7.0, 150], [7.07, 190], [7.2, 226], [7.5, 266], [8.0, 300], [8.4, 320], [10, 320]]),
  ry: pchip([[6.9, 290], [7.0, 300], [7.07, 320], [7.2, 340], [7.5, 365], [8.0, 420], [8.4, 440], [10, 440]]),
  ang: pchip([[6.9, 6], [7.0, 8], [7.07, 11], [7.2, 15], [7.5, 20], [8.0, 30], [8.4, 34], [10, 34]]),
  em: pchip([[8.4, 1], [8.53, 1.22], [8.67, 1.5], [8.8, 2.0], [8.93, 2.8], [9.1, 4], [10, 4]]),
  gray: pchip([[8.5, 0], [8.53, 0], [8.6, 58], [8.67, 107], [8.73, 145], [8.8, 185], [8.87, 232], [8.93, 250], [9.0, 255], [10, 255]])
};

/* ---------- form ---------- */
const form = document.getElementById('form');
const formTitle = T(form, '', 540, 207, 33, 700, '#000', 'c', 'letter-spacing:-.005em');
const FORM_TITLE = 'Subscribers-only Chat';
const feats = [
  ['Your inner circle', ['Give your subscribers an exclusive place to', 'connect with you.'], 463, 8.65,
    '<path d="M12 20.5C5 15.6 3 12.2 3 9a4.6 4.6 0 018.9-1.6L12 7.7l.1-.3A4.6 4.6 0 0121 9c0 3.2-2 6.6-9 11.5z"/>'],
  ['Share more', ['Send high-quality photos, videos, files, and', 'voice notes, or start audio calls.'], 607, 8.72,
    '<rect x="3" y="5.5" width="18" height="14" rx="3.5"/><circle cx="12" cy="12.5" r="3.6"/><path d="M8 5.5l1-2h6l1 2"/>'],
  ['Keep it exclusive', ['Private messaging with disappearing messages', 'and screenshot blocking.'], 751, 8.85,
    '<rect x="5" y="10" width="14" height="10.5" rx="3"/><path d="M8.5 10V7.5a3.5 3.5 0 017 0V10M10 15.2h4"/>'],
  ['Runs by itself', ['New subscribers join automatically, and', 'canceled subscribers are removed automatically.'], 891, 8.92,
    '<path d="M4 11a8 8 0 0113.7-4.7L20 8.5M20 4v4.5h-4.5M20 13a8 8 0 01-13.7 4.7L4 15.5M4 20v-4.5h4.5"/>']
].map(([h, d, y, t0, icon], k) => {
  const row = el(form, 'row', `top:${y}px`);
  row.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${icon}</svg>
    <div class="h" style="top:-4px;transform:translateY(-50%)">${h}</div>
    <div class="d" style="top:22px">${d[0]}<br>${d[1]}</div>`;
  return { row, y, t0, m: [1, 1.8, 2.8, 5][k] };
});
const titleY = pchip([[8.6, 275], [8.67, 261], [8.73, 248], [8.8, 238], [9.13, 216], [9.6, 207], [10, 207]]);
const featDrift = pchip([[8.65, 140], [8.73, 86], [8.8, 63], [9.13, 18], [9.6, 0], [10, 0]]);
const inY = pchip([[8.5, 473], [8.6, 432], [8.67, 396], [8.73, 373], [8.8, 364], [9.0, 356], [9.6, 351]]);
const inW = pchip([[8.5, 405], [8.6, 520], [8.67, 612], [8.73, 676], [8.8, 702], [9.0, 747]]);
const inScale = pchip([[9.7, 1], [9.8, 1.15], [9.87, 1.33], [9.93, 1.4], [10, 1.46]]);
const PH = 'Name your group (required)', TYPED = 'AJ’s I';

/* ---------- master render ---------- */
function render(t) {
  /* lines */
  const ys = lineYs(t), ws = lineWidths(t);
  for (let i = 0; i < 4; i++) {
    const on = ws[i] > 0 && (i === 0 || i === 3 ? true : true);
    L[i].style.display = on ? 'block' : 'none';
    L[i].style.top = (ys[i] - 1) + 'px';
    L[i].style.width = ws[i] + 'px';
  }
  // lines 1/4 initial pair sits at 360/720 until 1.13
  /* title */
  if (t < 1.8) {
    const n = clamp(Math.floor(t / 0.0667 + 0.02), 0, 11);
    title.style.fontSize = sizeA + 'px';
    title.style.width = '1080px'; title.style.textAlign = 'center'; title.style.paddingLeft = '0';
    title.style.display = n ? 'block' : 'none';
    setTitle(TITLE_A.slice(0, n).split(''));
    title.style.transform = `translate(${-37 * io3(prog(t, 1.05, 1.75))}px,-50%)`;
  } else if (t < 4.2) {
    const n = clamp(Math.ceil((t - 1.8) * 36.7), 1, 22);
    title.style.display = 'block';
    title.style.fontSize = sizeB + 'px';
    title.style.width = 'auto'; title.style.textAlign = 'left';
    const left = lerp(300, 92, Math.pow(n / 22, 0.8));
    title.style.left = (n === 22 ? 92 : left) + 'px';
    const u = prog(t, 3.6, 4.08), chars = TITLE_B.split('');
    const k = (chars.length - 1) / 2;
    setTitle(chars.slice(0, n), i => u > 0 && u >= 1 - 0 && true ? true : (u > 0 && Math.abs(i - k) / k <= u * 1.02));
    title.style.transform = 'translateY(-50%)';
  } else title.style.display = 'none';
  if (t < 1.8) title.style.left = '0px';

  renderPills(t, ys);

  /* phone */
  if (t >= 3.87 && t < 7.2) {
    phone.style.display = 'block';
    const top = t < 4.6 ? phoneY(t) : phoneTop2(t);
    phone.style.top = top + 'px';
    page.style.transform = `translateY(${-(scrollY(t) - (t < 4.6 ? 0 : 121 - top))}px)`;
    // badge swaps to the overlay pill once it leaves
    $('pbadge').style.visibility = t >= 6.45 ? 'hidden' : 'visible';
  } else phone.style.display = 'none';

  /* circle wipe + rings */
  if (t >= 6.65 && t < 9.1) {
    reveal.style.display = 'block';
    const r = revR(t);
    reveal.style.clipPath = `circle(${r}px at 540px 535px)`;
    const R = K.R(t);
    $('dot').setAttribute('r', R);
    const sl = K.sq(t), sr = 1083 - sl;
    $('sq1').setAttribute('x', sl - 12); $('sq2').setAttribute('x', sr - 12);
    $('ll').setAttribute('x2', sl - 12); $('lr').setAttribute('x1', sr + 12);
    const e = $('ell');
    const em = t < 8.4 ? 1 : K.em(t);
    const rx = K.rx(t) * em, ry = K.ry(t) * em, ang = K.ang(t);
    e.setAttribute('rx', rx); e.setAttribute('ry', ry);
    e.setAttribute('transform', `rotate(${ang} 540 540)`);
    const s = t < 8.45 ? 1 : ringS(t);
    $('rings').style.transform = `scale(${s})`;
    $('rings').style.transformOrigin = '540px 540px';
    $('rline').style.opacity = 1 - prog(t, 8.35, 8.55);
    reveal.style.opacity = 1;
    reveal.firstElementChild.style.opacity = t > 9.0 ? 0 : 1;
  } else if (t >= 9.1) {
    reveal.style.display = 'block';
    reveal.style.clipPath = 'circle(2000px at 540px 535px)';
    reveal.firstElementChild.style.opacity = 0;
  } else reveal.style.display = 'none';

  /* "New" pill -> input */
  if (t >= 6.45) {
    newpill.style.display = 'flex';
    if (t < 8.5) {
      const u = io3(prog(t, 6.5, 6.95)), uy = out3(prog(t, 6.5, 6.95));
      const w0 = 80, h0 = 42, w1 = 250, h1 = 130;
      let w = lerp(w0, w1, u), h = lerp(h0, h1, u);
      const x = lerp(790, 543, u), y = lerp(397, 540, uy);
      let n = 3;
      if (t >= 8.07) n = t < 8.17 ? 3 : t < 8.36 ? 2 : t < 8.5 ? 1 : 0;
      const full = lerp(0, 1, 1);
      // pill narrows with each erased letter
      if (t >= 8.07) w = w1 - (3 - n) * 36 + (n === 0 ? -40 : 0);
      // colour: blue -> black
      const c1 = prog(t, 6.5, 6.67), c2 = prog(t, 6.7, 7.05);
      const mix = (a, m, z) => Math.round(lerp(lerp(a, m, c1), z, c2));
      const r = mix(29, 10, 0), g = mix(155, 80, 0), b = mix(240, 125, 0);
      newpill.style.background = `rgb(${r},${g},${b})`;
      newpill.style.left = x + 'px'; newpill.style.top = y + 'px';
      newpill.style.width = w + 'px'; newpill.style.height = h + 'px';
      newpill.style.borderRadius = (h / 2) + 'px';
      newpill.style.fontSize = lerp(23, 62, u) + 'px';
      newpill.style.zIndex = 5;
      lab.textContent = 'New'.slice(0, n); lab.style.display = 'block'; lab.style.color = '#fff';
      ph.textContent = ''; ty.innerHTML = '';
      newpill.style.transform = 'translate(-50%,-50%)';
      newpill.style.overflow = 'hidden';
    } else {
      // morph into the white input
      const w = inW(t), y = inY(t);
      const mu = prog(t, 8.5, 9.0);
      const h = lerp(120, 104, out3(mu));
      newpill.style.width = w + 'px'; newpill.style.height = h + 'px';
      newpill.style.left = '540px'; newpill.style.top = y + 'px';
      newpill.style.borderRadius = lerp(60, 30, out3(mu)) + 'px';
      newpill.style.background = hex(K.gray(t));
      lab.textContent = '';
      // placeholder typing + erase from the left
      const pn = Math.round(clamp((t - 8.7) / 0.4, 0, 1) * PH.length);
      const removed = t < 9.35 ? 0 : Math.round(clamp((t - 9.35) * 70, 0, PH.length));
      const pv = PH.slice(0, pn);
      ph.innerHTML = '<span style="visibility:hidden">' + pv.slice(0, removed) + '</span>' + pv.slice(removed);
      ph.style.left = '30px';
      ph.style.color = hex(lerp(205, 168, prog(t, 8.7, 9.1)));
      const tn = clamp(Math.round((t - 9.53) / 0.07), 0, TYPED.length);
      const caretOn = t >= 9.55 && (Math.floor(t * 2) % 2 === 0 || t > 9.7);
      ty.innerHTML = TYPED.slice(0, tn) + (t >= 9.55 ? `<span class="caret" style="opacity:${caretOn ? 1 : 0}"></span>` : '');
      if (tn > 0) ph.style.left = (30) + 'px';
      const sc = t < 9.7 ? 1 : inScale(t);
      newpill.style.transform = `translate(-50%,-50%) ${sc !== 1 ? `translate(${(540 - 343) * (1 - 1) }px,0)` : ''}`;
      // zoom around (343,243) in stage coordinates
      const ox = 343 - (540 - w / 2), oy = 243 - (y - h / 2);
      newpill.style.transformOrigin = `${ox}px ${oy}px`;
      newpill.style.transform = `translate(-50%,-50%) scale(${sc})`;
    }
  } else newpill.style.display = 'none';

  /* form */
  if (t >= 8.6) {
    form.style.display = 'block';
    const n = clamp(Math.round(2 + (t - 8.6) * 36), 2, FORM_TITLE.length);
    formTitle.textContent = FORM_TITLE.slice(0, n);
    // grow around a fixed left edge like the reference
    const fl = 352, fw = 376;
    formTitle.style.left = (t < 9.13 ? lerp(fl + 0, fl, 1) : fl) + 'px';
    formTitle.style.transform = 'translateY(-50%)';
    formTitle.style.top = titleY(t) + 'px';
    const dr = featDrift(t);
    feats.forEach(f => {
      const a = clamp((t - f.t0) / 0.05);
      f.row.style.opacity = a;
      f.row.style.top = (f.y + dr * f.m) + 'px';
    });
  } else form.style.display = 'none';
}

window.seek = t => { render(t); };
window.DURATION = 10;

/* ---------- playback ---------- */
(function () {
  const q = new URLSearchParams(location.search);
  function fit() {
    const s = Math.min(innerWidth, innerHeight) / 1080;
    stage.style.transform = s === 1 ? 'none' : `scale(${s})`;
  }
  addEventListener('resize', fit); fit();
  if (q.has('t')) { render(parseFloat(q.get('t'))); return; }
  if (q.has('manual')) { render(0); return; }
  const rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t0 = performance.now();
  function tick(now) {
    let t = (now - t0) / 1000;
    if (t > 10.6) { t0 = now; t = 0; }
    render(rm ? 10 : Math.min(t, 10));
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
