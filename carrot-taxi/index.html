<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carrot taxi</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: grid; place-items: center; }
  svg { display: block; height: min(100vh, calc(100vw * 820 / 476)); aspect-ratio: 476 / 820; }
</style>
</head>
<body>
<div id="wrap"><svg id="s" viewBox="0 0 476 820" xmlns="http://www.w3.org/2000/svg"></svg></div>
<script>
const NS = 'http://www.w3.org/2000/svg';
const W = 476;
const K0 = 476 / 720;              // reference (720x1041) -> canvas (476 wide)
const WORLD_Y = 820 - 1041 * K0;   // keeps the bottom of the reference glued to the bottom edge
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const sstep = u => u * u * (3 - 2 * u);
const outBack = (u, c1 = 1.1) => { const c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };
const gauss = (t, c, w) => Math.exp(-Math.pow((t - c) / w, 2));
const mod = (a, n) => ((a % n) + n) % n;

function h(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

const svg = document.getElementById('s');
const defs = h('defs', {}, svg);
const sky = h('linearGradient', { id: 'sky', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
h('stop', { offset: 0, 'stop-color': '#a8dde2' }, sky);
h('stop', { offset: .6, 'stop-color': '#b3e0e6' }, sky);
h('stop', { offset: 1, 'stop-color': '#c4e6ea' }, sky);
h('rect', { x: 0, y: 0, width: W, height: 820, fill: 'url(#sky)' }, svg);

h('rect', { x: 0, y: 698, width: W, height: 130, fill: '#78afb2' }, svg);   // ground behind the skyline

/* ---------- speed model: the taxi drives to the LEFT, the world slides to the right ---------- */
const VMAX = 300;
function dist(t) {
  const s = t / 1.6;
  const base = s < 1 ? 1.6 * (s * s * s - s * s * s * s / 2) : 1.6 * 0.5 + (t - 1.6);
  const surge = 0.1 * (1 - Math.cos(0.7 * t)) / 0.7 * sstep(prog(t, 1.2, 3));
  return VMAX * (base + surge);
}

/* ---------- scrolling tiles (move right) ---------- */
const scrollers = [];
function scroller(tile, build, k, drift = 0) {
  const g = h('g', {}, svg);
  const a = h('g', {}, g), b = h('g', {}, g);
  build(a); build(b);
  scrollers.push({ a, b, tile, k, drift });
  return g;
}
function cloudShape(p, x, y, s, op) {
  const g = h('g', { transform: `translate(${x} ${y}) scale(${s})`, opacity: op, fill: '#dff2f4' }, p);
  h('rect', { x: 0, y: 24, width: 150, height: 36, rx: 18 }, g);
  h('rect', { x: 30, y: 2, width: 76, height: 42, rx: 21 }, g);
  h('rect', { x: 84, y: 14, width: 54, height: 34, rx: 17 }, g);
}

/* sun (behind the clouds), as in the reference: right of the carrot */
const sun = h('g', {}, svg);
const halo = h('circle', { r: 40, fill: '#ffd25c', opacity: .3 }, sun);
h('circle', { r: 31, fill: '#ffc53a' }, sun);

scroller(900, p => {
  [[40, 350, 1.0], [300, 336, 1.2], [560, 372, .85], [760, 340, 1.05]].forEach(([x, y, s]) => cloudShape(p, x, y, s, .78));
}, 0.03, 9);
scroller(1250, p => {
  [[-30, 420, .95], [310, 452, 1.35], [640, 432, .9], [900, 500, 1.1], [1100, 540, .8]].forEach(([x, y, s]) => cloudShape(p, x, y, s, .72));
}, 0.07, 16);

function skyline(seed, tile, base, color, cap, zones, win) {
  return p => {
    const r = rng(seed);
    const g = h('g', { fill: color }, p);
    let x = 0;
    while (x < tile) {
      const z = zones.find(z => x / tile < z.end) || zones[zones.length - 1];
      let w = z.w[0] + r() * (z.w[1] - z.w[0]);
      if (x + w > tile) w = tile - x;
      if (w < 6) break;
      const hh = z.h[0] + r() * (z.h[1] - z.h[0]);
      if (z.kind === 'trees') {
        const rad = 12 + r() * 10;
        h('rect', { x: x + w / 2 - 2.5, y: base - hh * .5, width: 5, height: hh * .5 + 4, fill: z.trunk }, g);
        h('circle', { cx: x + w / 2, cy: base - hh * .5 - rad * .4, r: rad, fill: z.leaf }, g);
        h('circle', { cx: x + w / 2 + rad * .6, cy: base - hh * .5 + rad * .1, r: rad * .7, fill: z.leaf }, g);
        x += w + (z.gap || 8); continue;
      }
      if (z.kind === 'poles') {
        h('rect', { x, y: base - hh, width: 4, height: hh + 4, fill: z.leaf }, g);
        h('rect', { x: x - 10, y: base - hh, width: 24, height: 4, rx: 2, fill: z.leaf }, g);
        x += w + (z.gap || 40); continue;
      }
      h('rect', { x, y: base - hh, width: w, height: hh + 4 }, g);
      if (cap) h('rect', { x: x - 2, y: base - hh, width: w + 4, height: 7, fill: cap }, g);
      if (z.roof) h('path', { d: `M${x - 3} ${base - hh} L${x + w / 2} ${base - hh - 22} L${x + w + 3} ${base - hh} Z`, fill: cap || color }, g);
      if (win && w > 40) {
        const cols = Math.floor((w - 12) / 22), rows = Math.floor((hh - 20) / 22);
        for (let c = 0; c < cols; c++) for (let rr = 0; rr < rows; rr++) {
          const wx = x + 9 + c * 22, wy = base - hh + 16 + rr * 22;
          h('rect', { x: wx, y: wy, width: 15, height: 14, fill: win, rx: 1 }, g);
          h('path', { d: `M${wx} ${wy + 14} L${wx + 15} ${wy} L${wx + 15} ${wy + 14} Z`, fill: 'rgba(255,255,255,.13)' }, g);
        }
      }
      x += w + (z.gap || 0);
    }
  };
}
scroller(900, skyline(11, 900, 700, '#a2cdd1', null, [{ end: 1, w: [34, 86], h: [220, 300] }]), 0.05);
scroller(1100, skyline(22, 1100, 700, '#92c3c7', '#86b9be', [{ end: 1, w: [60, 120], h: [170, 260] }]), 0.12);
scroller(1800, skyline(33, 1800, 700, '#7db5b9', '#6aa3a8', [
  { end: .33, w: [80, 140], h: [120, 190], gap: 6 },
  { end: .55, w: [80, 116], h: [80, 120], roof: true, gap: 12 },
  { end: .75, w: [30, 46], h: [70, 110], kind: 'trees', leaf: '#6eab9f', trunk: '#5b8f8d', gap: 12 },
  { end: 1, w: [70, 130], h: [120, 200], gap: 10 }
], '#5d979c'), 0.3);
scroller(1500, skyline(44, 1500, 704, '#5f9d96', null, [
  { end: .3, w: [26, 40], h: [40, 62], kind: 'trees', leaf: '#5f9d96', trunk: '#4e8582', gap: 40 },
  { end: .45, w: [20, 28], h: [90, 110], kind: 'poles', leaf: '#4e8582', gap: 170 },
  { end: .8, w: [26, 40], h: [44, 70], kind: 'trees', leaf: '#5f9d96', trunk: '#4e8582', gap: 90 },
  { end: 1, w: [20, 28], h: [90, 110], kind: 'poles', leaf: '#4e8582', gap: 200 }
]), 0.85);

const streaks = [];
{
  const r = rng(77);
  const g = h('g', {}, svg);
  for (let i = 0; i < 9; i++) {
    const e = h('rect', { height: 2.2, rx: 1.1, fill: '#fff', opacity: .4 }, g);
    streaks.push({ e, x0: r() * (W + 260), y: 520 + r() * 150, len: 30 + r() * 50, k: 1.8 + r() * 1.2 });
  }
}

/* =====================================================================
   Taxi + carrot — drawn in the reference's own coordinates (720 x 1041)
   ===================================================================== */
const world = h('g', { transform: `translate(0 ${WORLD_Y}) scale(${K0})` }, svg);
const car = h('g', {}, world);
const carrot = h('g', {}, car);               // everything that sits behind the hood

/* steering wheel + hand resting on top of it (left), traced from the reference */
const wheel = h('g', {}, carrot);
const wheelRot = h('g', {}, wheel);
h('rect', { x: 163, y: 822, width: 52, height: 30, rx: 14, fill: '#e8871a' }, wheelRot);       // palm: joins thumb and fingers under the bar
h('rect', { x: 200, y: 810, width: 13, height: 40, rx: 6.5, fill: '#e8871a' }, wheelRot);       // fingers
h('rect', { x: 160, y: 820, width: 22, height: 14, rx: 7, fill: '#e8871a', transform: 'rotate(10 171 827)' }, wheelRot);   // thumb, same piece as the palm
h('line', { x1: 173, y1: 789, x2: 192, y2: 856, stroke: '#3b3b3b', 'stroke-width': 17, 'stroke-linecap': 'round' }, wheelRot);
h('rect', { x: 163, y: 826, width: 17, height: 11, rx: 5.5, fill: '#e8871a' }, wheelRot);       // thumb tip in front of the bar

/* greens: three bubbles that flutter independently around the stem */
h('path', { d: 'M383 486 Q379 504 383 522', fill: 'none', stroke: '#6b8f23', 'stroke-width': 7, 'stroke-linecap': 'round' }, carrot);
const greens = h('g', { transform: 'translate(383 517)' }, carrot);
const leafAll = h('g', {}, greens);   // all bubbles + highlights move as ONE rigid piece
const leafL = leafAll, leafR = leafAll, leafM = leafAll;
function leaf(p, cx, cy, r, hx, hy, hr) {
  h('circle', { cx: cx - 383, cy: cy - 517, r, fill: '#8bb934' }, p);
  h('circle', { cx: hx - 383, cy: hy - 517, r: hr, fill: '#a5cd55', opacity: .55 }, p);
}
leaf(leafL, 297, 460, 44, 280, 442, 14);
leaf(leafR, 468, 448, 40, 457, 436, 14);
leaf(leafM, 383, 433, 58, 366, 418, 20);

/* body */
const bodyD = 'M281 548 Q281 517 312 517 L458 517 Q490 517 495 556 L387 1010 L281 1010 Z';
const clip = h('clipPath', { id: 'bodyClip' }, defs);
h('path', { d: bodyD }, clip);
h('path', { d: bodyD, fill: '#f7941d' }, carrot);
const shade = h('g', { 'clip-path': 'url(#bodyClip)' }, carrot);
h('path', { d: 'M458 517 Q490 517 495 556 L387 1010 L352 1010 Z', fill: '#e8871a' }, shade);
h('rect', { x: 400, y: 575, width: 52, height: 15, rx: 7.5, fill: '#e8871a' }, shade);
h('rect', { x: 383, y: 658, width: 66, height: 15, rx: 7.5, fill: '#e8871a' }, shade);
h('circle', { cx: 411, cy: 567, r: 5, fill: '#e8871a' }, shade);
h('circle', { cx: 431, cy: 622, r: 3.5, fill: '#e8871a' }, shade);
h('circle', { cx: 298, cy: 775, r: 4.2, fill: '#e8871a' }, shade);
h('circle', { cx: 311, cy: 788, r: 3, fill: '#e8871a' }, shade);

/* face: sunglasses + wide smirk */
const face = h('g', {}, carrot);
const lensL = 'M225 690 H348 A61.5 68 0 0 1 225 690 Z';
const lensR = 'M357 690 H484 A63.5 68 0 0 1 357 690 Z';
const lensClip = h('clipPath', { id: 'lensClip' }, defs);
h('path', { d: lensL }, lensClip); h('path', { d: lensR }, lensClip);
h('path', { d: lensL, fill: '#3d3d3d' }, face);
h('path', { d: lensR, fill: '#3d3d3d' }, face);
h('rect', { x: 340, y: 690, width: 26, height: 9, fill: '#3d3d3d' }, face);
h('rect', { x: 470, y: 690, width: 22, height: 10, rx: 5, fill: '#3d3d3d' }, face);
const diaL = h('path', { d: 'M0 -8.5 L8.5 0 L0 8.5 L-8.5 0 Z', fill: '#fff' }, face);
const diaR = h('path', { d: 'M0 -8.5 L8.5 0 L0 8.5 L-8.5 0 Z', fill: '#fff' }, face);
const shineG = h('g', { 'clip-path': 'url(#lensClip)' }, face);
const shine = h('rect', { x: 200, y: 670, width: 30, height: 110, fill: '#fff', opacity: 0, transform: 'skewX(-24)' }, shineG);
const shine2 = h('rect', { x: 200, y: 670, width: 12, height: 110, fill: '#fff', opacity: 0, transform: 'skewX(-24)' }, shineG);
const mouth = h('g', {}, face);
h('path', { d: 'M320 772 C344 790 388 788 414 764 C413 790 393 809 366 809 C342 809 324 794 320 772 Z', fill: '#fff', stroke: '#d57a1a', 'stroke-width': 4.5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, mouth);
h('path', { d: 'M330 778 C352 792 386 790 407 772', fill: 'none', stroke: '#e9d7c4', 'stroke-width': 2.5, 'stroke-linecap': 'round' }, mouth);

/* the yellow taxi body, drawn over the base of the carrot */
const hood = h('g', {}, car);
h('rect', { x: -30, y: 845, width: 780, height: 330, fill: '#ffc929' }, hood);
h('rect', { x: -30, y: 845, width: 780, height: 48, fill: '#ffd54a' }, hood);
const check = h('g', { fill: '#3b3b3b' }, hood);
[268, 346, 425].forEach(x => h('rect', { x, y: 930, width: 40, height: 39 }, check));
[307, 386].forEach(x => h('rect', { x, y: 969, width: 40, height: 39 }, check));
const hoodShine = h('rect', { x: -100, y: 905, width: 110, height: 5, rx: 2.5, fill: '#fff', opacity: 0 }, hood);

/* the right arm hangs outside, over the door (in front of the yellow body) */
const armLayer = h('g', {}, car);
const arm = h('g', {}, armLayer);
const armRot = h('g', {}, arm);
h('path', { d: 'M413 802 L440 799.5 C470 797 484 815 483 840 C482 862 474 877 458 887', fill: 'none', stroke: '#d4811b', 'stroke-width': 13, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, armRot);
const mit = h('g', { fill: '#c9741a', transform: 'rotate(-6 446 892)' }, armRot);   // mitten: one rounded body + thumb
h('path', { d: 'M436 880 Q436 872 446 872 Q457 872 457 882 L457 896 Q457 910 446 910 Q436 910 436 896 Z' }, mit);
h('ellipse', { cx: 434.5, cy: 890, rx: 6.5, ry: 11, transform: 'rotate(14 434.5 890)' }, mit);

/* ---------- timeline ---------- */
const GLINTS = [2.7, 5.4, 8.2];
function steer(t) {
  const calm = 2.6 * Math.sin(1.25 * t) + 1.6 * Math.sin(2.9 * t + 1);
  const turns = 11 * gauss(t, 4.1, .55) - 13 * gauss(t, 6.7, .6) + 9 * gauss(t, 8.7, .5);
  return calm * sstep(prog(t, 1.4, 2.6)) + turns;
}
function render(t) {
  const D = dist(t);
  const A = sstep(prog(t, 0.3, 1.6));
  const bump = (ph, amp) => A * amp * (1.1 * Math.sin(2 * Math.PI * 2.1 * t + ph) + .6 * Math.sin(2 * Math.PI * 3.4 * t + ph * 1.7 + 1));
  const st = steer(t);

  scrollers.forEach(sc => {
    const off = mod(D * sc.k + t * sc.drift, sc.tile);
    const dy = bump(0, 0.35) * sc.k * 2;
    sc.a.setAttribute('transform', `translate(${off - sc.tile} ${dy})`);
    sc.b.setAttribute('transform', `translate(${off} ${dy})`);
  });
  const sp = A * 0.75 + 0.25 * sstep(prog(t, 0, 1));
  streaks.forEach(s => {
    const x = mod(s.x0 + D * s.k * 0.9, W + 260) - 130;
    s.e.setAttribute('x', x - s.len); s.e.setAttribute('y', s.y); s.e.setAttribute('width', s.len * (0.4 + sp));
    s.e.setAttribute('opacity', 0.36 * sp);
  });

  halo.setAttribute('r', 40 + 2.5 * Math.sin(t * 1.6));
  sun.setAttribute('transform', `translate(389 ${318 - 4 * Math.sin(t * .35)})`);

  // the whole taxi rises from below the frame, then keeps bouncing on the road
  const carOff = 330 * (1 - outBack(prog(t, 0.2, 1.25), 0.7));
  const bumpRef = bump(0, 1.1) / K0;
  car.setAttribute('transform', `translate(0 ${carOff + bumpRef})`);
  // the carrot then rises out of the taxi
  const rel = 640 * (1 - outBack(prog(t, 0.75, 2.2), 1.15));
  const lean = st * 0.3 + 0.6 * A * Math.sin(2 * Math.PI * 2.1 * t - 0.8);
  const bodyT = `translate(0 ${rel}) rotate(${lean} 353 880)`;
  carrot.setAttribute('transform', bodyT);

  // greens are blown back (to the right) because the taxi drives left — one rigid bunch, one pivot
  const wind = A;
  const fl = (ph, f) => Math.sin(2 * Math.PI * f * t + ph);
  const rising = 1 - prog(t, 1.4, 2.4);
  const gAng = (8 + 5 * fl(0, 1.6) + 2 * fl(1.7, 3.1)) * wind + 2 - st * .3 + 7 * rising * fl(0, 3);
  leafAll.setAttribute('transform', `rotate(${gAng}) translate(${3 * wind} ${1.5 * fl(1, 2.7) * wind})`);

  // steering: the hand on the wheel turns it, the outside arm swings after the carrot has risen
  wheelRot.setAttribute('transform', `rotate(${-st * 1.4} 190 846)`);
  const swing = 1 - outBack(prog(t, 2.0, 2.8), 1.3);
  armLayer.setAttribute('transform', bodyT);
  armLayer.setAttribute('opacity', prog(t, 1.95, 2.15));
  armRot.setAttribute('transform', `rotate(${-80 * swing + st * 0.9 + 2.2 * Math.sin(2 * Math.PI * 1.1 * t)} 416 802)`);

  // face
  face.setAttribute('transform', `translate(${-lean * 1.2} 0)`);
  let g = 0;
  GLINTS.forEach(c => { g = Math.max(g, gauss(t, c + .12, .13)); });
  const ds = 0.85 + 0.6 * g + 0.06 * Math.sin(t * 5);
  diaL.setAttribute('transform', `translate(325 713) scale(${ds}) rotate(${g * 45})`);
  diaR.setAttribute('transform', `translate(457 713) scale(${ds}) rotate(${g * 45})`);
  let sh = -1, so = 0;
  GLINTS.forEach(c => { const u = (t - c) / .6; if (u > 0 && u < 1) { sh = u; so = Math.sin(Math.PI * u); } });
  if (sh >= 0) {
    const x = 190 + 300 * sh;
    shine.setAttribute('x', x); shine.setAttribute('opacity', .38 * so);
    shine2.setAttribute('x', x + 48); shine2.setAttribute('opacity', .3 * so);
  } else { shine.setAttribute('opacity', 0); shine2.setAttribute('opacity', 0); }
  // little smile "breathing"
  mouth.setAttribute('transform', `translate(366 786) scale(${1 + 0.04 * Math.sin(t * 2.2)} ${1 + 0.1 * g}) translate(-366 -786)`);

  hoodShine.setAttribute('x', mod(D * 1.3, 900) - 120);
  hoodShine.setAttribute('opacity', 0.35 * A);
}

window.seek = t => render(t);
window.DURATION = 10;
(function () {
  const q = new URLSearchParams(location.search);
  if (q.has('t')) { render(parseFloat(q.get('t'))); return; }
  if (q.has('manual')) { render(0); return; }
  let t0 = performance.now();
  function tick(now) {
    let t = (now - t0) / 1000;
    if (t > 10.6) { t0 = now; t = 0; }
    render(Math.min(t, 10));
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
